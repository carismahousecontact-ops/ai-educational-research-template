name: CI - Bun Lint & Build Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Build (Bun)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile

      - name: Run Typecheck & Lint
        run: bun run lint

      - name: Build Production Bundle
        run: bun run build

      - name: Verify Dist Artifacts
        run: |
          test -f dist/index.html || exit 1
          echo "Production build verified successfully with Bun."
